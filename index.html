<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria artesanalde</title>
</head>

<body>
    <div class="header">
        <div class="title">
            <h1>Pizzaria artesanal</h1>
        </div>

        <div class="buttons">
            <button>Entrar</button>
            <button>Cadrastar</button>
        </div>
    </div>
    <main>
        <div class="slider"> <!--slider do carrosel-->

            <div class="container">
                <input type="radio" name="btn-radio-carrosel" id="radio1">
                <input type="radio" name="btn-radio-carrosel" id="radio2">
                <input type="radio" name="btn-radio-carrosel" id="radio3">
                <input type="radio" name="btn-radio-carrosel" id="radio4">

                <!--botões de navegação-->

                <div class="main-banner SlideOne">
                    <!-- <img src="./imgs/pizza_carrrosel1.jpg" alt=""> -->
                </div>
                <div class="main-banner SlideTwo">
                    <!-- <img src="./imgs/pizza_carrrosel2.jpg" alt=""> -->
                </div>
                <div class="main-banner SlideThree">
                    <!-- <img src="./imgs/pizza_carrrosel3.jpg" alt=""> -->
                </div>
                <div class="main-banner SlideFour">
                    <!-- <img src="./imgs/pizza_carrrosel4.jpg" alt=""> -->
                </div>

                <div class="nav-auto">
                    <div class="auto-button1"></div>
                    <div class="auto-button2"></div>
                    <div class="auto-button3"></div>
                    <div class="auto-button4"></div>
                </div>

                <div class="nav-manual">
                    <label for="radio1" class="botao-manual"></label>
                    <label for="radio2" class="botao-manual"></label>
                    <label for="radio3" class="botao-manual"></label>
                    <label for="radio4" class="botao-manual"></label>
                </div>
            </div>

        </div>
    </main>
    <section>
        <div class="locais">
            
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
